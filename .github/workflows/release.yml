# Fabrique et publie automatiquement une Release quand on pousse un tag de version (ex. v0.2.0).
#
#   git tag v0.2.0
#   git push origin v0.2.0
#
# Etapes : compilation, tests, installateur (Inno Setup), ZIP portable, puis creation de la Release
# avec le setup, son empreinte .sha256 et le ZIP. Seuls les tags avec suffixe (v0.3.0-beta.1) sont des "pre-release".
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # necessaire pour creer la Release

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Tests
        run: dotnet test --nologo -v q

      - name: Installer Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Fabriquer le setup et le ZIP portable
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          ./creer-setup.ps1 -Version $version

      - name: Creer la Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          $options = @()
          # Une pre-release n'est jamais proposee par la mise a jour d'Atome (API releases/latest).
          # Donc les versions 0.x sont des Releases normales ; seul un tag avec suffixe (v0.3.0-beta.1)
          # devient une pre-release : pratique pour publier un essai sans le proposer a tout le monde.
          if ($version.Contains("-")) { $options += "--prerelease" }
          # Le .sha256 (fabrique par creer-setup.ps1) est obligatoire : sans lui, Atome refuse la mise a jour automatique.
          $empreinte = "installateur/sortie/Atome-Setup-$version.exe.sha256"
          if (-not (Test-Path $empreinte)) { throw "Empreinte SHA-256 manquante : $empreinte" }
          gh release create $tag `
            "installateur/sortie/Atome-Setup-$version.exe" `
            $empreinte `
            "installateur/sortie/Atome-portable.zip" `
            --title "Atome $version" `
            --notes-file .github/release-notes.md `
            --generate-notes `
            @options
