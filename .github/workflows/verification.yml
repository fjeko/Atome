# Compile toute la solution (application WPF comprise) et lance les tests à chaque envoi sur une branche
# autre que main, et à chaque pull request. Permet de vérifier un changement sans Visual Studio.
name: Verification

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verification:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Compilation
        run: dotnet build --nologo -v q

      - name: Tests
        run: dotnet test --nologo --no-build -v q --logger "trx;LogFileName=resultats.trx" --results-directory resultats

      # Les tests ratés deviennent des annotations sur le commit (lisibles sans ouvrir le journal).
      - name: Tests ratés en annotations
        if: failure()
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem resultats -Filter *.trx -Recurse -ErrorAction SilentlyContinue) {
            [xml]$x = Get-Content $f.FullName
            foreach ($r in $x.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq "Failed" }) {
              $msg = ($r.Output.ErrorInfo.Message -replace "`r?`n", " ")
              if ($msg.Length -gt 900) { $msg = $msg.Substring(0, 900) }
              Write-Output "::error title=$($r.testName)::$msg"
            }
          }
